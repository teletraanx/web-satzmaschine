<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satzmaschine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <div class="boot-status">
          <span class="prompt">&gt;</span>
          <span>SATZMASCHINE_OS boot sequence complete</span>
        </div>

        <h1>Satzmaschine</h1>

        <p class="subtitle">
          STATUS: SENTENCE GENERATOR ONLINE
        </p>

        <section class="generator">

            <p class="label">
                Say the sentence:
            </p>

            <p id="sentence" class="sentence">
                Loading...
            </p>

            <button id="generateButton">
                Generate Sentence
            </button>

        </section>

    </main>

    <script src="satzmaschine.js"></script>
    <script src="app.js"></script>

</body>

</html>
